# Pushing a version tag (v0.3.0) builds the signed release APK and attaches it to a draft
# GitHub release named "PRGC Launcher 0.3.0". Write the release notes on GitHub and publish it;
# only then do the in-app update check and Obtainium see it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"$version\"" app/build.gradle.kts; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName in app/build.gradle.kts. Bump versionName (and versionCode) first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: gradle/actions/setup-gradle@v4

      # A release signed with any other key wouldn't install over the app, so this fails
      # without the secrets.
      - name: Signing key
        env:
          REQUIRE_KEY: 1
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: .github/scripts/signing-key.sh

      - name: Unit tests and release APK
        run: ./gradlew test :app:assembleRelease --console=plain

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="prgc-launcher-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --draft --verify-tag \
            --title "PRGC Launcher $version" \
            --generate-notes

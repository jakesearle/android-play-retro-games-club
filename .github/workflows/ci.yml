# Runs the unit tests and Android lint on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner's Android SDK, with the platform the app compiles against.
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew test :app:lintDebug --console=plain

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            catalogue/build/reports/
          if-no-files-found: ignore
